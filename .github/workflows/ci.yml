name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core (go.mod replace)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/Muxcore-Media/core.git" \
            "$(dirname "$GITHUB_WORKSPACE")/core"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...

  test:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core (go.mod replace)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/Muxcore-Media/core.git" \
            "$(dirname "$GITHUB_WORKSPACE")/core"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - run: go test -count=1 -timeout 10m ./...

  build:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core (go.mod replace)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/Muxcore-Media/core.git" \
            "$(dirname "$GITHUB_WORKSPACE")/core"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - run: |
          go build -o /dev/null ./cmd/module
          go vet ./...

  docker:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    needs: [lint, test, build]
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Prepare monorepo layout for Docker
        run: |
          dir=distributed-lock-sqlite
          mkdir -p "$dir"
          shopt -s dotglob
          for item in * .[^.]*; do
            [[ "$item" == "$dir" ]] && continue
            [[ -e "$item" ]] || continue
            mv "$item" "$dir/"
          done
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/Muxcore-Media/core.git" \
            core
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./distributed-lock-sqlite/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
